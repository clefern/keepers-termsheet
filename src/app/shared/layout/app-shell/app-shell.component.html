<div class="shell">
  <header class="shell__bar">
    <span class="shell__brand">TermSheet</span>

    @if (user$ | async; as user) {
      <div class="shell__user">
        <span class="shell__user-name">{{ user.displayName }}</span>
        <button type="button" class="shell__signout" (click)="logout()">Sign out</button>
      </div>
    }
  </header>

  <main class="shell__content">
    <ng-content />
  </main>
</div>
